name: Build & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board:
          - fqbn: esp32:esp32:esp32
            name: ESP32-Dev-Module
            platform: esp32:esp32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board platform
        run: |
          arduino-cli core update-index
          arduino-cli core install ${{ matrix.board.platform }}

      - name: Install libraries
        run: |
          arduino-cli lib install MFRC522-spi-i2c-uart-async
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install PubSubClient
          arduino-cli lib install ArduinoJson

      - name: Compile release binaries
        run: |
          arduino-cli compile --fqbn ${{ matrix.board.fqbn }} --build-path build .
          mkdir -p release
          cp build/*.bin release/BambuTagger-AMS-${{ matrix.board.name }}.bin
          cp build/*.elf release/BambuTagger-AMS-${{ matrix.board.name }}.elf
          ls -la release/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
